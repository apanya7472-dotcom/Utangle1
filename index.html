<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untangle Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --ink:#1F2A2E; --muted:#5B676C; --line:#E6DFD3; --field:#D4CBBD;
  --primary:#0F6E6E; --primary-dark:#0A5454; --primary-tint:#E3F1EF; --primary-line:#CDE5E1;
  --accent:#F2A93B; --accent-tint:#FDF0D9;
  --good:#2E7D4F; --good-tint:#E4F2E9; --warn:#9A5B00; --warn-tint:#FFF0D6; --bad:#B3412E; --bad-tint:#FBE7E2;
  --error:#B3261E; --error-tint:#FDECEA;
  --font-head:'Bricolage Grotesque','Noto Sans Devanagari',system-ui,sans-serif;
  --font-body:'Noto Sans','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(31,42,46,.05),0 6px 20px rgba(31,42,46,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font-body);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
main{flex:1}
body.has-bar main{padding-bottom:84px}
@media(min-width:1024px){body.has-bar main{padding-bottom:0}}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;margin:0 0 12px;letter-spacing:-.01em;font-weight:700;color:var(--ink)}
h1{font-size:30px} h2{font-size:23px} h3{font-size:19px} h4,.h4{font-size:17px;font-family:var(--font-head);font-weight:700}
@media(min-width:768px){h1{font-size:40px}h2{font-size:28px}h3{font-size:20px}}
:lang(hi) p,:lang(hi) li{line-height:1.75}
p{margin:0 0 12px}
a{color:var(--primary);font-weight:600;text-underline-offset:3px}
ul,ol{margin:0 0 12px;padding-left:22px}
li+li{margin-top:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.narrow{max-width:640px;margin:0 auto;padding:0 16px}
.page{padding-top:24px;padding-bottom:48px}
@media(min-width:768px){.page{padding-top:40px;padding-bottom:72px}}
.muted{color:var(--muted)} .small{font-size:15px} .tiny{font-size:13px}
.stack>*+*{margin-top:16px} .stack-lg>*+*{margin-top:24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.center{text-align:center}
.grid2,.grid3,.grid4{display:grid;gap:16px}
@media(min-width:768px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:420px){.hide-xs{display:none!important}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-bottom:8px;text-decoration:none;font-weight:600}
.back svg{width:20px;height:20px}
hr.sep{border:0;border-top:1px solid var(--line);margin:24px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r);border:1.5px solid transparent;font:600 16px/1.2 var(--font-body);cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,color .15s;text-align:center}
.btn:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--primary);padding:0 12px}
.btn-ghost:hover{background:var(--primary-tint)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger:hover{background:#962F1F}
.btn-danger-outline{background:#fff;color:var(--bad);border-color:#EBC3BA}
.btn-danger-outline:hover{border-color:var(--bad)}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 14px;font-size:15px}
.btn[disabled],.btn.is-disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:20px;height:20px;flex:none}
.btn-row{display:flex;flex-direction:column;gap:12px}
@media(min-width:560px){.btn-row{flex-direction:row;flex-wrap:wrap}}

/* cards & badges */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
@media(min-width:768px){.card{padding:24px}}
.card-tint{background:var(--primary-tint);border-color:var(--primary-line)}
.card-warm{background:var(--accent-tint);border-color:#F3D9A8}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;line-height:1.35;white-space:nowrap}
.badge svg{width:14px;height:14px}
.b-good{background:var(--good-tint);color:var(--good)} .b-warn{background:var(--warn-tint);color:var(--warn)} .b-bad{background:var(--bad-tint);color:var(--bad)}
.b-neutral{background:#F1ECE3;color:var(--muted)} .b-primary{background:var(--primary-tint);color:var(--primary)}

/* forms */
.field{display:block}
.label{display:block;font-weight:600;margin-bottom:6px}
.input,.textarea,.select{width:100%;min-height:48px;padding:12px 14px;border:1.5px solid var(--field);border-radius:var(--r);background:#fff;font:400 16px/1.55 var(--font-body);color:var(--ink)}
.textarea{min-height:240px;resize:vertical}
@media(min-width:768px){.textarea.big{min-height:340px}}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(15,110,110,.18)}
.has-error .input,.has-error .textarea,.has-error .select{border-color:var(--error);background:#FFFBFA}
.err{display:flex;gap:6px;align-items:flex-start;color:var(--error);font-size:15px;font-weight:600;margin-top:8px}
.err svg{width:18px;height:18px;flex:none;margin-top:2px}
.help{font-size:14px;color:var(--muted);margin-top:6px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:20px 0}
.divider:before,.divider:after{content:"";flex:1;border-top:1px solid var(--line)}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);font-size:15px;border:1px solid;line-height:1.55}
.alert>svg{flex:none;width:20px;height:20px;margin-top:2px}
.alert p:last-child{margin:0}
.a-info{background:var(--primary-tint);border-color:var(--primary-line);color:#0B4A4A}
.a-warn{background:var(--accent-tint);border-color:#F0D49E;color:#5E3A00}
.a-error{background:var(--error-tint);border-color:#F4C7C2;color:#8C1D17}
.a-good{background:var(--good-tint);border-color:#C5E3D0;color:#1E5A37}

/* header & footer */
.hdr{position:sticky;top:0;z-index:20;background:rgba(251,247,240,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:8px;min-height:64px}
.logo{display:flex;align-items:center;gap:8px;font:700 21px var(--font-head);color:var(--ink);text-decoration:none;margin-right:auto;min-height:44px}
.logo svg{width:32px;height:32px;flex:none}
.navlink{display:none!important}
@media(min-width:768px){.navlink{display:inline-flex!important}}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-tint);color:var(--primary);display:grid;place-items:center;font-weight:700;text-decoration:none;border:1.5px solid var(--primary-line);flex:none}
.ftr{border-top:1px solid var(--line);padding:28px 0 36px;font-size:14px;color:var(--muted);background:var(--bg)}
.ftr nav{display:flex;flex-wrap:wrap;gap:4px 8px;margin-bottom:8px}
.ftr nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px 0 0;color:var(--ink);font-weight:600;text-decoration:none}
.ftr nav a:hover{color:var(--primary)}

/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(20,28,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:540px;border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s}
.sheet.wide{max-width:720px}
@media(min-width:768px){.overlay{align-items:center;padding:24px}.sheet{border-radius:20px;padding:28px}}
.sheet-x{float:right;margin:-8px -8px 0 8px;width:44px;height:44px;border-radius:50%;border:0;background:#F4EFE6;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.sheet-x svg{width:20px;height:20px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(24px);opacity:.6}}
#toast-root{position:fixed;left:0;right:0;bottom:96px;z-index:70;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
@media(min-width:1024px){#toast-root{bottom:32px}}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);font-weight:500;font-size:15px;max-width:480px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s}

/* segmented / chips / switch */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;padding:3px;gap:3px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;font:600 15px var(--font-body);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.seg button svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:1.5px solid var(--field);border-radius:999px;background:#fff;font:500 15px var(--font-body);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--primary-tint);border-color:var(--primary);color:var(--primary-dark);font-weight:600}
.opt-list{display:grid;gap:8px}
.opt{min-height:48px;padding:10px 16px;border:1.5px solid var(--field);border-radius:var(--r);background:#fff;font:500 16px var(--font-body);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;color:var(--ink)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--field);flex:none}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-tint);font-weight:600}
.opt[aria-pressed="true"] .dot{border-color:var(--primary);background:radial-gradient(var(--primary) 0 45%,#fff 50%)}
.switch{width:56px;height:32px;border-radius:999px;border:0;background:#C9C1B4;position:relative;cursor:pointer;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]:after{left:27px}

/* landing */
.hero{padding:32px 0 40px}
.hero-grid{display:grid;gap:28px;align-items:center}
@media(min-width:900px){.hero{padding:64px 0}.hero-grid{grid-template-columns:1.1fr .9fr;gap:56px}}
.hero h1{font-size:34px}
@media(min-width:768px){.hero h1{font-size:52px}}
.hero .lead{font-size:18px;color:#3C4A4F;max-width:560px}
.photo{margin:0;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:#fff}
.photo-art{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#F6EBD7 0 16px,#F1E2C8 16px 32px);display:grid;place-items:center;color:#8A6A3A}
.photo-art svg{width:44px;height:44px}
.photo figcaption{padding:12px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);line-height:1.5}
.section{padding:40px 0}
@media(min-width:768px){.section{padding:64px 0}}
.section-alt{background:#F5EFE4;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.step-num{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#3B2600;font:700 17px var(--font-head);display:grid;place-items:center;margin-bottom:12px}
.ex .ba{display:grid;gap:10px;margin:12px 0}
.ex .ba div{padding:12px 14px;border-radius:var(--r);font-size:15px;line-height:1.55}
.ex .before{background:#F6F1E8}
.ex .after{background:var(--primary-tint)}
.ex .ba b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.ex .before b{color:var(--muted)} .ex .after b{color:var(--primary)}
.saved{font:700 20px var(--font-head);color:var(--good)}
.check-list{list-style:none;padding:0}
.check-list li{display:flex;gap:10px;align-items:flex-start}
.check-list li svg{width:20px;height:20px;color:var(--primary);flex:none;margin-top:3px}
.cta-band{background:var(--primary);color:#fff;border-radius:20px;padding:32px 20px;text-align:center}
.cta-band h2{color:#fff}
.cta-band .btn-primary{background:var(--accent);color:#2B1C00}
.cta-band .btn-primary:hover{background:#E8992A}

/* input page */
.input-grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.input-grid{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.dz{border:2px dashed var(--field);border-radius:var(--r-lg);padding:20px;text-align:center;background:#fff}
.dz svg{width:28px;height:28px;color:var(--primary)}
.lockbox{border:2px dashed var(--line);border-radius:var(--r-lg);padding:18px;background:#F7F2EA;display:flex;gap:14px;align-items:flex-start}
.lockbox>svg{width:24px;height:24px;color:var(--muted);flex:none;margin-top:2px}
.file-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.file-row .fi{width:40px;height:40px;border-radius:10px;background:var(--primary-tint);color:var(--primary);display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;text-transform:uppercase}
.file-row .fn{flex:1;min-width:0}
.file-row .fn div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:#F1ECE3;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.textbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.linkbtn{background:none;border:0;padding:0;min-height:44px;font:600 15px var(--font-body);color:var(--primary);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* follow-up */
.q{transition:opacity .15s}
.q .qnum{font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.04em;text-transform:uppercase}
.q.skipped{background:#F7F2EA;border-style:dashed}
.q.skipped .qbody{display:none}
.q-foot{display:flex;justify-content:flex-end;margin-top:8px}
.progress{height:8px;border-radius:99px;background:#EDE6DA;overflow:hidden}
.progress span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.sticky-foot{position:sticky;bottom:0;background:linear-gradient(rgba(251,247,240,0),var(--bg) 24%);padding:24px 0 calc(16px + env(safe-area-inset-bottom));z-index:5}

/* processing */
.pstep{display:flex;gap:14px;align-items:center;padding:12px 0;color:var(--muted);font-weight:500}
.pstep .pi{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:#fff}
.pstep .pi svg{width:18px;height:18px;opacity:0}
.pstep.doing{color:var(--ink);font-weight:600}
.pstep.doing .pi{border-color:var(--primary);border-top-color:transparent;animation:spin .8s linear infinite}
.pstep.done{color:var(--ink)}
.pstep.done .pi{background:var(--primary);border-color:var(--primary);color:#fff}
.pstep.done .pi svg{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.knot{width:88px;height:88px;margin:0 auto 16px;display:block}
.knot path{stroke-dasharray:160;animation:draw 2.4s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:160}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-160}}

/* report */
.report-grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1024px){.report-grid{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.report-aside{position:sticky;top:88px;max-height:calc(100vh - 104px);overflow:auto;padding-bottom:8px}}
.report-head{display:flex;flex-direction:column;gap:12px}
@media(min-width:768px){.report-head{flex-direction:row;justify-content:space-between;align-items:flex-start}}
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.glance div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left}
.glance b{display:block;font:700 22px/1.2 var(--font-head);color:var(--primary)}
.glance span{font-size:13px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.jump{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;max-width:100%}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none}
.rsec{scroll-margin-top:84px;margin-top:32px}
.rsec>h2{display:flex;align-items:center;gap:10px}
.rsec>h2 .n{width:30px;height:30px;border-radius:8px;background:var(--accent-tint);color:#7A4A00;font-size:15px;display:grid;place-items:center;flex:none}
.psteps{list-style:none;padding:0;counter-reset:s;margin:0}
.psteps li{counter-increment:s;display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.psteps li:last-child{border-bottom:0}
.psteps li:before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--primary-tint);color:var(--primary);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none;margin-top:1px}
.bn{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.bn:last-child{border-bottom:0}
.bn-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bn-top b{font-size:16px}
.sev{display:flex;gap:3px;align-items:center;flex:none}
.sev i{width:16px;height:8px;border-radius:2px;background:#EDE6DA}
.sev.h i{background:var(--bad)} .sev.m i:nth-child(-n+2){background:var(--accent)} .sev.l i:first-child{background:#9BB8B3}
.bn-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.idea{margin-top:16px;padding:0;overflow:hidden}
.idea-hd{display:flex;gap:12px;padding:20px 20px 0}
.idea-num{width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;font:700 17px var(--font-head);display:grid;place-items:center;flex:none}
.idea.v-skip .idea-num{background:#8E8A84}
.idea-hd h3{margin-bottom:8px}
.idea-body{padding:12px 20px 20px}
.verdict-line{padding:10px 14px;border-radius:var(--r);font-size:15px;margin:4px 0 14px}
.v-now .verdict-line{background:var(--good-tint);color:#1E5A37}
.v-plan .verdict-line{background:var(--warn-tint);color:#5E3A00}
.v-skip .verdict-line{background:var(--bad-tint);color:#7E2A1C}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.facts div{background:#FAF7F2;border:1px solid #EFE8DC;border-radius:var(--r);padding:10px 12px}
.facts dt{font-size:13px;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-size:15px;font-weight:600;line-height:1.45}
.facts .wide{grid-column:1/-1}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.meter i{width:10px;height:10px;border-radius:3px;background:#E3DBCE}
.meter i.on{background:var(--primary)}
details.guide{border-top:1px solid var(--line);margin:0 -20px -20px}
details.guide summary{list-style:none;cursor:pointer;min-height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--primary)}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary svg{width:20px;height:20px;transition:transform .2s}
details.guide[open] summary svg{transform:rotate(90deg)}
details.guide ol{padding:0 20px 20px 44px;margin:0}
details.guide li{padding-left:4px}
.order{list-style:none;padding:0;margin:0}
.order li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);margin:0}
.order li:last-child{border-bottom:0}
.order .when{font-size:13px;font-weight:700;color:var(--muted);padding-top:2px}
.order .what{font-weight:600}
.order .why{font-size:14px;color:var(--muted)}
.notes{list-style:none;padding:0;margin:0}
.notes li{display:flex;gap:10px;padding:10px 0;align-items:flex-start}
.notes li svg{width:20px;height:20px;color:var(--warn);flex:none;margin-top:3px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.bar .bb{flex:1;min-height:56px;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px var(--font-body);color:var(--ink);cursor:pointer;text-decoration:none}
.bar .bb svg{width:22px;height:22px;color:var(--primary)}
.bar .bb:active{background:var(--primary-tint)}
.bar .btn{flex:1}
@media(min-width:1024px){.bar{display:none}}
.act-list{display:grid;gap:8px}
.act-list .btn{justify-content:flex-start}
.act-list .btn .lk{margin-left:auto;color:var(--muted)}
.rate-btns{display:flex;gap:10px}
.rate-btns button{flex:1;min-height:52px;border:1.5px solid var(--field);border-radius:var(--r);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--font-body);color:var(--ink)}
.rate-btns button svg{width:22px;height:22px}
.rate-btns button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-tint);color:var(--primary-dark)}
.chat-log{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.bubble{padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.55;max-width:92%}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:#F6F1E8;border-bottom-left-radius:4px}
.bubble.ai .who{font-size:12px;font-weight:700;color:var(--primary);display:block;margin-bottom:2px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.chat-form{display:flex;gap:8px}
.chat-form .input{flex:1}
.chat-form .btn{padding:0 14px}
.count-pill{font-size:13px;font-weight:600;color:var(--muted);background:#F1ECE3;border-radius:999px;padding:3px 10px}

/* dashboard */
.usage .num{font:700 28px var(--font-head);color:var(--primary)}
.rep-item{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.rep-item:hover{border-color:var(--primary)}
.rep-item>svg{width:22px;height:22px;color:var(--muted);flex:none;margin-left:auto}
.rep-item h3{margin-bottom:4px}
.rep-ic{width:48px;height:48px;border-radius:12px;background:var(--accent-tint);color:#8A5A00;display:grid;place-items:center;flex:none}
.rep-ic svg{width:24px;height:24px}
.empty{text-align:center;padding:40px 20px}
.empty svg.ill{width:120px;height:120px;margin:0 auto 16px;display:block}
.status-ill{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px}
.status-ill svg{width:34px;height:34px}
.si-good{background:var(--good-tint);color:var(--good)} .si-bad{background:var(--error-tint);color:var(--error)} .si-info{background:var(--primary-tint);color:var(--primary)} .si-warn{background:var(--accent-tint);color:#8A5A00}

/* settings */
.set-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;word-break:break-word}

/* admin */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs a{min-height:48px;padding:0 14px;display:inline-flex;align-items:center;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--primary);border-color:var(--primary)}
.tile .big{font:700 28px/1.15 var(--font-head);color:var(--ink);margin:4px 0}
.tile .lbl{font-size:14px;color:var(--muted);font-weight:600}
.tile .sub{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.bars{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:8px}
.bars .b{flex:1;background:var(--primary);border-radius:4px 4px 0 0;position:relative;min-width:0}
.bars .b:last-child{background:var(--accent)}
.bars-x{display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:6px}
.bars-x span{flex:1;text-align:center;min-width:0}
.fun{margin:14px 0}
.fun-top{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:6px}
.fun-track{height:12px;border-radius:99px;background:#EDE6DA;position:relative}
.fun-track span{display:block;height:100%;border-radius:99px;background:var(--primary)}
.fun-track .target{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.urow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .who{flex:1 1 220px;min-width:0}
.urow .who b{display:block}
.urow .meta{font-size:14px;color:var(--muted);flex:1 1 200px}
.fb{padding:14px 0;border-bottom:1px solid var(--line)}
.fb:last-child{border-bottom:0}

/* email preview */
.email{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.email-meta{padding:14px 18px;background:#F6F1E8;font-size:14px;border-bottom:1px solid var(--line)}
.email-meta div{overflow:hidden;text-overflow:ellipsis}
.email-body{padding:24px 20px}
.email-body .logo{margin-bottom:16px}
.preview-tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4E3F7A;background:#ECE8F7;border-radius:6px;padding:4px 8px;margin-bottom:12px}

/* legal */
.legal h2{font-size:21px;margin-top:28px}
.legal p,.legal li{color:#33403F}

/* mockup tools (not part of product) */
.mock-fab{position:fixed;right:12px;bottom:16px;z-index:45;background:#3B2F5C;color:#fff;border:0;border-radius:999px;min-height:44px;padding:0 16px;font:600 14px var(--font-body);display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 6px 18px rgba(59,47,92,.35)}
.mock-fab svg{width:18px;height:18px}
body.has-bar .mock-fab{bottom:84px}
@media(max-width:767px){.mock-fab{padding:0;width:44px;justify-content:center;font-size:0;gap:0}.mock-fab svg{width:20px;height:20px}}
@media(min-width:1024px){body.has-bar .mock-fab{bottom:16px}}
.mock-group{margin-top:18px}
.mock-group h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#4E3F7A;margin-bottom:8px}
.mock-items{display:flex;flex-wrap:wrap;gap:6px}
.mock-items button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #D9D3EA;background:#F7F5FC;font:500 14px var(--font-body);color:#2C2445;cursor:pointer;text-align:left}
.mock-items button:hover{border-color:#3B2F5C}
.mock-items button.on{background:#3B2F5C;color:#fff}
</style>

<body>

<button class="mock-fab" onclick="openDrawer()" aria-label="Mockup: jump to any screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>All screens</button>

<script>

const P=(d,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
const ICONS={

const ic=(n,extra)=>P(ICONS[n]||'',extra);
const icDown=()=>P(ICONS.up,'style="transform:rotate(180deg)"');
const LOGO=`<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0F6E6E"/><path d="M5 19.5c2.6 0 3.4-8 7-8s2.6 6.5-.4 6.5-1.7-6.2 3.2-6.2" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round"/><path d="M14.8 11.8H27" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/></svg>`;

const EXAMPLE_TEXT="Humare paas roz 35-40 orders WhatsApp pe aate hain retailers se — kabhi text, kabhi voice note, kabhi saree ki photo bhej dete hain. Mehul (staff) sab orders ek register mein likhta hai. Phir godown jaake check karta hai stock hai ya nahi. Raat ko main Tally mein invoice banata hoon, uska PDF WhatsApp pe bhejta hoon. Payment 30 din se late ho jaaye toh main khud phone karke yaad dilata hoon, aur ek alag diary mein likhta hoon kisne diya kisne nahi. Mahine ke end mein CA bank statement se diary match karta hai. Roz 3-4 ghante sirf isi mein chale jaate hain.";

const S={
 role:'guest', userKind:'new', name:'Rajesh Patel', first:'Rajesh', email:'rajesh.p@example.com', method:'Google',
 guestUsed:false, guestReport:false, claimGuest:false,
 reports:[], used:0, lang:'en',
 text:'', textErr:false, files:[], fileErrs:[],
 answers:{q1:['WhatsApp','Tally','Paper register or diary']}, skipped:{},
 flow:{mode:'new',from:null},
 failNext:false, blocked:false, dataShare:false,
 chats:{}, ratings:{}, shares:{}, shareTarget:'A', deleted:[],
 pendingEmail:'', signinErr:'', contact:{name:'',email:'',topic:'',msg:''}, contactErr:{},
 userFilter:'all', userQuery:'', fbFilter:'all', delErr:false
};
const LIMIT=10;
const left=()=>Math.max(0,LIMIT-S.used);

let timers=[];
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function go(r){ if(location.hash==='#/'+r) render(); else location.hash='#/'+r; }
function cur(){ return decodeURIComponent(location.hash.replace(/^#\/?/,''))||'landing'; }
function needUser(){ if(S.role!=='user'){ setTimeout(()=>go('signin'),0); return true;} return false; }
function needAdmin(){ if(S.role!=='admin'){ setTimeout(()=>go('signin'),0); return true;} return false; }
function render(){
  clearTimers(); closeModal();
  const parts=cur().split('/'); const name=parts[0], arg=parts[1];
  const fn=SCREENS[name]||SCREENS.notfound;
  const html=fn(arg);
  $('#app').innerHTML=html;
  document.body.classList.toggle('has-bar',!!$('#app .bar'));
  renderHeader(name); renderFooter(name);
  window.scrollTo(0,0);
  if(AFTER[name]) AFTER[name](arg);
}
function refresh(){ const y=window.scrollY; const parts=cur().split('/'); const fn=SCREENS[parts[0]]||SCREENS.notfound; $('#app').innerHTML=fn(parts[1]); document.body.classList.toggle('has-bar',!!$('#app .bar')); renderHeader(parts[0]); window.scrollTo(0,y); }
window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function modal(html,wide){ $('#modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet ${wide?'wide':''}" role="dialog" aria-modal="true"><button class="sheet-x" onclick="closeModal()" aria-label="Close">${ic('x')}</button>${html}</div></div>`; document.body.style.overflow='hidden'; const f=$('#modal-root [autofocus]'); if(f) setTimeout(()=>f.focus(),50); }
function closeModal(){ $('#modal-root').innerHTML=''; document.body.style.overflow=''; }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.innerHTML=m; const r=$('#toast-root'); r.innerHTML=''; r.appendChild(t); setTimeout(()=>t.remove(),3400); }

function renderHeader(name){
  let right='';
  const logoHref = S.role==='user'?'#/dashboard':S.role==='admin'?'#/admin':'#/landing';
  if(S.role==='admin'){
    right=`<span class="badge b-warn">Admin</span><button class="btn btn-secondary btn-sm" onclick="signOut()">Sign out</button>`;
  } else if(S.role==='user'){
    right=`<a class="btn btn-ghost btn-sm navlink" href="#/dashboard">My analyses</a>
      <a class="btn btn-primary btn-sm" href="#/input" onclick="startNew()" aria-label="New analysis">${ic('plus')}<span class="hide-xs">New analysis</span></a>
      <a class="avatar" href="#/settings" aria-label="Account settings">RP</a>`;
  } else {
    right=`<a class="btn btn-ghost btn-sm navlink" href="#/sample">Sample report</a>
      <a class="btn btn-secondary btn-sm" href="#/signin" onclick="S.claimGuest=S.guestReport">Sign in</a>
      <a class="btn btn-primary btn-sm" href="#/input">Try it free</a>`;
  }
  $('#hdr').innerHTML=`<header class="hdr"><div class="wrap"><a class="logo" href="${logoHref}" aria-label="Untangle home">${LOGO}Untangle</a>${right}</div></header>`;

function renderFooter(){
  $('#ftr').innerHTML=`<footer class="ftr"><div class="wrap">
    <nav aria-label="Footer"><a href="#/privacy">Privacy policy</a><a href="#/terms">Terms of use</a><a href="#/contact">Contact us</a></nav>
    <p class="tiny" style="margin:0">Untangle gives advice only — it never logs in to, connects to or changes your apps.<br>© 2026 Untangle · Made in India</p>
  </div></footer>`;
}
function signIn(method){
  if(method==='admin'){ S.role='admin'; go('admin'); toast('Signed in to the admin panel'); return; }
  if(S.blocked){ go('suspended'); return; }
  S.method = method==='microsoft'?'Microsoft':method==='email'?'Email link':'Google';
  S.role='user';
  if(S.claimGuest && S.guestReport){ setupUser('claimed'); S.guestReport=false; S.claimGuest=false; go('dashboard'); toast('Your report from earlier is saved to your account'); return; }
  if(!S.reports.length && S.userKind!=='new') setupUser(S.userKind);
  if(S.userKind==='new' && !S.reports.length) setupUser('new');
  go('dashboard');
}
function signOut(){ S.role='guest'; S.lang='en'; go('landing'); toast('You’ve signed out'); }
function setupUser(kind){
  S.userKind=kind; S.role='user'; S.lang='en'; S.chats={}; S.ratings={}; S.shares={};
  if(kind==='new'){ S.reports=[]; S.used=0; }
  if(kind==='claimed'){ S.reports=[{id:'A',key:'A',date:'4 Oct 2026',claimed:true}]; S.used=0; }
  if(kind==='returning'||kind==='limit'){ S.reports=[{id:'A',key:'A',date:'2 Oct 2026',files:true},{id:'B',key:'B',date:'1 Oct 2026'}]; S.used= kind==='limit'?10:2;
    S.chats.A={used:1,msgs:[{me:1,t:'Idea 2 ka step 4 samajh nahi aaya — dropdown kaise banate hain?'},{me:0,t:'Bilkul! Phone par: (1) “In stock?” column ke upar wala letter tap karein. (2) Teen dots ⋮ → “Data validation”. (3) “Add rule” → Criteria mein “Dropdown” chunein. (4) Do options likhein: Yes aur No. (5) “Done” dabayein. Ab har row mein ek chhota teer aayega jisse Mehul Yes ya No chun sakta hai.'}]};
  }
  S.deleted=[];
}
function entryById(id){ return S.reports.find(e=>e.id===id); }
function startNew(){ S.flow={mode:'new',from:null}; S.files=[]; S.fileErrs=[]; S.textErr=false; S.text=''; S.skipped={}; S.answers={q1:['WhatsApp','Tally','Paper register or diary']}; }

/* ============ DATA ============ */

  }

    aside=`<div class="card card-tint stack"><div class="logo" style="margin:0">${LOGO}Untangle</div><p class="small">Untangle reads a description of any slow work process and suggests honest, practical ways to automate or simplify it — with costs in ₹ and step-by-step guides.</p><a class="btn btn-primary btn-block" href="#/landing">Try it yourself — free</a></div>`;

function rateHtml(id){

  return `<h3 class="h4">Was this report useful?</h3>

}
function rate(id,v){ S.ratings[id]={v}; $('#rate-box').innerHTML=rateHtml(id); }
function sendRate(id){ S.ratings[id].sent=true; $('#rate-box').innerHTML=rateHtml(id); toast('Feedback sent — thank you'); }

function getChat(id){ if(!S.chats[id]) S.chats[id]={used:0,msgs:[]}; return S.chats[id]; }
function chatHtml(id,key){
  const c=getChat(id), l=10-c.used;
  const log=c.msgs.map(m=>m.me?`<div class="bubble me">${esc(m.t)}</div>`:`<div class="bubble ai"><span class="who">Untangle</span>${m.typing?'<span class="typing"><i></i><i></i><i></i></span>':esc(m.t)}</div>`).join('');
  return `<div class="row between"><h3 class="h4" style="margin:0">Ask about this report</h3><span class="count-pill">${l} of 10 left</span></div>
   ${c.msgs.length?`<div class="chat-log" aria-live="polite">${log}</div>`:`<p class="small muted" style="margin:10px 0">Ask anything about this report — for example, to explain a step more simply. Questions don’t use up your monthly analyses.</p>`}
   ${l<=0?`<div class="alert a-warn">${ic('info')}<div><p style="margin-bottom:8px"><b>You’ve used all 10 questions for this report.</b> For fresh ideas, edit your process and re-run it.</p><a class="btn btn-primary btn-sm" href="#/rerun/${id}">Edit and re-run</a></div></div>`:`
   ${c.used<3?`<div class="chips" style="margin:8px 0 12px">${CHAT_SUGG.map((s,i)=>`<button class="chip" onclick="sendChat('${id}','${key}',${i})">${s}</button>`).join('')}</div>`:''}
   <form class="chat-form" onsubmit="event.preventDefault();sendChat('${id}','${key}',-1)"><label class="sr" for="chat-in">Your question</label><input class="input" id="chat-in" placeholder="Type your question…" autocomplete="off"><button class="btn btn-primary" aria-label="Send">${ic('send')}</button></form>
   <p class="help">Write in English, Hindi or Hinglish — we’ll reply the same way.</p>`}`;
}
function sendChat(id,key,i){
  const c=getChat(id); if(c.used>=10) return;
  let q, a;
  if(i>=0){ q=CHAT_SUGG[i]; a=CHAT_ANS[key][i]; }
  else { const el=$('#chat-in'); q=el.value.trim(); if(!q){ el.focus(); return; }
    a=/[ऀ-ॿ]/.test(q)?CHAT_DEFAULT.hi:/\b(kaise|kya|hai|nahi|mein|karu|karein|samajh|kaun|kitna|bataiye|hoga)\b/i.test(q)?CHAT_DEFAULT.hinglish:CHAT_DEFAULT.en; }
  c.used++; c.msgs.push({me:1,t:q}); const m={me:0,typing:1,t:''}; c.msgs.push(m);
  $('#chat-box').innerHTML=chatHtml(id,key);
  setTimeout(()=>{ m.typing=0; m.t=a; const box=$('#chat-box'); if(box){ box.innerHTML=chatHtml(id,key); const inp=$('#chat-in'); if(inp) inp.focus({preventScroll:true}); } },1100);
}

function filesHtml(){
  if(S.role!=='user') return `<div class="lockbox">${ic('lock')}<div><b>Sign up to attach files</b><p class="small muted" style="margin:4px 0 8px">With a free account you can attach SOPs, Excel sheets, PDFs or screenshots — up to 3 files.</p><button class="btn btn-secondary btn-sm" onclick="S.claimGuest=false;go('signin')">Sign up free</button></div></div>`;
  const errs=S.fileErrs.map(e=>`<div class="alert a-error" style="margin-top:10px">${ic('alert')}<p>${e}</p></div>`).join('');
  const rows=S.files.map((f,i)=>`<div class="file-row"><span class="fi">${f.t}</span><div class="fn"><div>${esc(f.n)}</div><div class="tiny muted">${fmtMB(f.s)} · Ready</div></div><button class="icon-btn" aria-label="Remove ${esc(f.n)}" onclick="S.files.splice(${i},1);S.fileErrs=[];$('#files').innerHTML=filesHtml()">${ic('x')}</button></div>`).join('');
  return `<div class="stack" style="--g:8px">${rows}</div>
   ${S.files.length<3?`<div class="dz" style="margin-top:${S.files.length?'10px':'0'}">${ic('clip')}<p style="margin:6px 0 2px;font-weight:600">${S.files.length?'Add another file':'Add files'} <span class="muted" style="font-weight:400">(optional)</span></p><p class="tiny muted">Up to 3 files, 10 MB each · PDF, Word, Excel, CSV, PNG, JPG</p><button class="btn btn-secondary btn-sm" onclick="pickModal()">Choose files</button></div>`:`<p class="help">You’ve added 3 files — the most for one analysis. Remove one to add a different file.</p>`}${errs}`;
}
function pickModal(){
  modal(`<h2>Choose a file</h2><p class="small muted">Simulated file picker — pick any to see how it’s handled.</p><div class="stack">${PICK.map((f,i)=>`<div class="file-row"><span class="fi">${f.t}</span><div class="fn"><div>${f.n}</div><div class="tiny muted">${fmtMB(f.s)}</div></div><button class="btn btn-secondary btn-sm" onclick="addFile(${i})">Add</button></div>`).join('')}</div>`);
}
function addFile(i){
  const f=PICK[i]; S.fileErrs=[];
  if(S.files.length>=3) S.fileErrs.push('You can attach up to 3 files. Remove one to add another.');
  else if(S.files.some(x=>x.n===f.n)) S.fileErrs.push(`“${f.n}” is already attached.`);
  else if(!OK_TYPES.includes(f.t)) S.fileErrs.push(`“${f.n}” can’t be attached — we accept PDF, Word, Excel, CSV, PNG and JPG files. You can carry on without it.`);
  else if(f.s>10) S.fileErrs.push(`“${f.n}” is ${fmtMB(f.s)} — the limit is 10 MB per file. Try saving a smaller copy, or carry on without it.`);
  else S.files.push(f);
  closeModal(); $('#files').innerHTML=filesHtml();
}
function onText(el){ S.text=el.value; $('#wc').textContent=wc(S.text)+' words'; if(S.textErr&&wc(S.text)>=12){ S.textErr=false; $('#f-text').classList.remove('has-error'); const e=$('#text-err'); if(e) e.remove(); } }
function useExample(){ S.text=EXAMPLE_TEXT; const t=$('#ptext'); t.value=S.text; onText(t); t.focus(); }
function generate(){
  if(wc(S.text)<12){ S.textErr=true; $('#f-text').classList.add('has-error'); if(!$('#text-err')) $('#f-text').insertAdjacentHTML('beforeend',`<div class="err" id="text-err">${ic('alert')}<span>This is a bit short for us to work with. Tell us the steps one by one — for example: “Customers send orders on WhatsApp, my staff writes them in a register, then I make the bill in Tally.” This won’t use up your analysis.</span></div>`); $('#ptext').focus(); return; }
  go('followup');
}
function inputForm(rerunId){
  const isUser=S.role==='user';
  const rerunE=rerunId?entryById(rerunId):null;
  return `<div class="wrap page">
   <a class="back" href="${rerunE?'#/report/'+rerunId:isUser?'#/dashboard':'#/landing'}">${ic('back')}${rerunE?'Back to report':isUser?'My analyses':'Home'}</a>
   <div class="input-grid">
    <div class="stack-lg">
     <div><h1>${rerunE?'Edit and re-run':'Describe your process'}</h1>
      <p class="muted" style="margin:0">${rerunE?'Change anything — your description, files or answers — and we’ll make a fresh report.':'Write it the way you’d explain it to a friend: what happens, who does it, which apps or papers you use, and what annoys you about it.'}</p></div>
     ${rerunE?`<div class="alert a-info">${ic('info')}<p>Re-running uses <b>1 of your ${left()} analyses</b> left this month. Your current report will be kept.</p></div>`:''}
     <div class="alert a-warn">${ic('shield')}<p><b>Please don’t paste</b> passwords, customer personal data, or anything your employer doesn’t allow you to share.</p></div>
     <div class="field ${S.textErr?'has-error':''}" id="f-text">
      <label class="label" for="ptext">Your process</label>
      <textarea class="textarea big" id="ptext" oninput="onText(this)" placeholder="For example: Every Monday I collect timesheets from 6 staff on WhatsApp, copy them into Excel, and work out salaries by hand. It takes about 3 hours and I often make mistakes…">${esc(S.text)}</textarea>
      <div class="textbar"><span class="help" style="margin:0">${ic('mic','style="width:16px;height:16px;vertical-align:-3px"')} Any language is fine. On a phone, tap the microphone on your keyboard to speak.</span><span class="help" style="margin:0" id="wc">${wc(S.text)} words</span></div>
      ${S.text?'':`<button class="linkbtn" onclick="useExample()">Not sure what to write? Use an example</button>`}
     </div>
     <div><span class="label">Supporting files</span><div id="files">${filesHtml()}</div></div>
     <div>
      <button class="btn btn-primary btn-block" onclick="generate()">Generate analysis</button>
      <p class="help center">${isUser?`${left()} of 10 analyses left this month · `:'Your 1 free analysis · '}Next: a few quick questions (you can skip them)</p>
     </div>
    </div>
    <aside class="card card-tint"><h3 class="h4">What makes a good description</h3>
     <ul class="check-list small">
      <li>${ic('check')}<span>Each step, in the order it happens</span></li>
      <li>${ic('check')}<span>Who does each step</span></li>
      <li>${ic('check')}<span>Which apps, files or papers are used</span></li>
      <li>${ic('check')}<span>How often it happens and roughly how long it takes</span></li>
      <li>${ic('check')}<span>What goes wrong most often</span></li></ul>
     <p class="small muted" style="margin:0">Long documents are fine — paste a whole SOP if you have one.</p></aside>
   </div></div>`;
}
SCREENS.input=()=>{
  if(S.role==='admin') return SCREENS.admin();
  if(S.role==='guest'&&S.guestUsed) return statusPage('si-info','lock','You’ve used your free analysis',`<p class="muted">Guests get one free analysis. Create a free account to run <b>10 analyses every month</b>, attach files, and keep your reports.</p>${S.guestReport?'<p class="small muted">Your earlier report is still available for 24 hours after it was made.</p>':''}`,`<button class="btn btn-primary btn-block" onclick="claim()">Sign up to run more analyses</button>${S.guestReport?'<a class="btn btn-secondary btn-block" href="#/guest-report">View my report</a>':''}`);
  if(S.role==='user'&&left()<=0) return statusPage('si-warn','clock','You’ve used all 10 analyses for October','<p class="muted">Your free analyses reset on <b>1 November 2026</b> at midnight. Until then you can still open, download and share your reports, and ask questions about them.</p>',`<a class="btn btn-primary btn-block" href="#/dashboard">Go to my analyses</a>`);
  return inputForm(null);
};
SCREENS.rerun=id=>{
  if(needUser()) return '';
  const e=entryById(id); if(!e) return SCREENS.notfound();
  if(left()<=0) return SCREENS.input();
  if(S.flow.mode!=='rerun'||S.flow.from!==id){ S.flow={mode:'rerun',from:id}; S.text=EXAMPLE_TEXT; S.files=e.files?[PICK[1],PICK[2]]:[]; S.fileErrs=[]; S.answers={q1:['WhatsApp','Tally','Paper register or diary'],q2:'Only if they’re free',q4:'₹2 lakh – ₹5 lakh'}; S.skipped={q3:1,q5:1}; }
  return inputForm(id);
};

/* ---- follow-up ---- */
function fuCount(){ return QS.filter(q=>!S.skipped[q.id]&&S.answers[q.id]&&(Array.isArray(S.answers[q.id])?S.answers[q.id].length:String(S.answers[q.id]).trim())).length; }
function fuCountUpdate(){ const n=fuCount(); $('#fu-n').textContent=n; $('#fu-bar').style.width=(n/QS.length*100)+'%'; }
function fuToggle(q,i){ const Q=QS.find(x=>x.id===q); const v=Q.opts[i];
  if(Q.type==='multi'){ const a=S.answers[q]=S.answers[q]||[]; const k=a.indexOf(v); k>=0?a.splice(k,1):a.push(v); } else S.answers[q]=v;
  refresh(); }
function fuSkip(q,on){ if(on) S.skipped[q]=1; else delete S.skipped[q]; refresh(); }
SCREENS.followup=()=>{
  if(S.role==='guest'&&S.guestUsed) return SCREENS.input();
  if(S.role==='user'&&left()<=0) return SCREENS.input();
  const n=fuCount();
  const cards=QS.map((Q,qi)=>{ const sk=!!S.skipped[Q.id]; const a=S.answers[Q.id];
   let body='';
   if(Q.type==='multi') body=`${Q.note?`<p class="small" style="background:var(--primary-tint);padding:8px 12px;border-radius:10px">${Q.note}</p>`:''}<div class="chips">${Q.opts.map((o,i)=>`<button class="chip" aria-pressed="${!!(a&&a.includes(o))}" onclick="fuToggle('${Q.id}',${i})">${a&&a.includes(o)?ic('check'):''}${o}</button>`).join('')}</div>`;
   if(Q.type==='single') body=`<div class="opt-list" role="radiogroup">${Q.opts.map((o,i)=>`<button class="opt" role="radio" aria-pressed="${a===o}" aria-checked="${a===o}" onclick="fuToggle('${Q.id}',${i})"><span class="dot"></span>${o}</button>`).join('')}</div>`;
   if(Q.type==='number') body=`<div class="row" style="flex-wrap:nowrap"><input class="input" style="max-width:180px" inputmode="numeric" id="in-${Q.id}" placeholder="${Q.ph}" value="${esc(a||'')}" oninput="S.answers['${Q.id}']=this.value.replace(/[^0-9]/g,'');this.value=S.answers['${Q.id}'];fuCountUpdate()"><span class="muted">${Q.suffix}</span></div>`;
   return `<section class="card q ${sk?'skipped':''}" aria-labelledby="qh-${Q.id}">
     <div class="qnum">Question ${qi+1} of ${QS.length}${sk?' · Skipped':''}</div>
     <h3 id="qh-${Q.id}" style="margin:6px 0 4px">${Q.q}</h3>
     <div class="qbody"><p class="small muted">${Q.why}</p>${body}</div>
     <div class="q-foot">${sk?`<button class="btn btn-ghost btn-sm" onclick="fuSkip('${Q.id}',false)">Answer this question</button>`:`<button class="btn btn-ghost btn-sm" onclick="fuSkip('${Q.id}',true)">Skip</button>`}</div>
   </section>`; }).join('');
  return `<div class="narrow page">
   <a class="back" href="${S.flow.mode==='rerun'?'#/rerun/'+S.flow.from:'#/input'}">${ic('back')}Back to your description</a>
   <h1>A few quick questions</h1>
   <p class="muted">Your answers make the time and cost estimates more accurate. Skip anything you don’t know or don’t want to share — you’ll still get a full report.</p>
   <div class="row between small" style="margin:16px 0 8px"><span><b id="fu-n">${n}</b> of ${QS.length} answered</span><button class="linkbtn" onclick="startProcessing()">Skip all and generate</button></div>
   <div class="progress"><span id="fu-bar" style="width:${n/QS.length*100}%"></span></div>
   <div class="stack" style="margin-top:20px">${cards}</div>
   <div class="sticky-foot"><div class="btn-row"><button class="btn btn-primary" style="flex:2" onclick="startProcessing()">Generate my report</button><button class="btn btn-secondary" style="flex:1" onclick="QS.forEach(q=>S.skipped[q.id]=1);startProcessing()">Skip all and generate</button></div></div>
  </div>`;
};
function startProcessing(){ go('processing'); }

/* ---- processing ---- */
SCREENS.processing=()=>{
  const steps=['Reading your process',...(S.role==='user'&&S.files.length?[`Reviewing your ${S.files.length} file${S.files.length>1?'s':''}`]:[]),'Finding bottlenecks','Looking for ideas that use tools you already have','Writing your step-by-step guide'];
  return `<div class="narrow page"><div class="card" style="padding:32px 20px">
   <svg class="knot" viewBox="0 0 88 88" aria-hidden="true"><path d="M10 56c8 0 10-26 22-26s9 21-1 21-6-20 11-20h36" fill="none" stroke="#0F6E6E" stroke-width="5" stroke-linecap="round"/></svg>
   <h1 class="center" style="font-size:28px">Untangling your process…</h1>
   <p class="center muted">This usually takes under 2 minutes.</p>
   <div class="progress" style="margin:20px 0"><span id="pbar" style="width:4%"></span></div>
   <div role="status" aria-live="polite">${steps.map(s=>`<div class="pstep"><span class="pi">${ic('check')}</span>${s}</div>`).join('')}</div>
   ${S.role==='user'?`<div class="alert a-info" style="margin-top:16px">${ic('mail')}<p>You don’t need to wait here. If it takes more than a minute, we’ll email <b>${S.email}</b> when your report is ready.</p></div>`:`<div class="alert a-warn" style="margin-top:16px">${ic('info')}<p>Please keep this page open. As a guest, we can’t email you when it’s ready.</p></div>`}
  </div></div>`;
};
AFTER.processing=()=>{
  const steps=$$('.pstep'); let i=0;
  const tick=()=>{ if(i>0){ steps[i-1].classList.remove('doing'); steps[i-1].classList.add('done'); }
    if(i<steps.length){ steps[i].classList.add('doing'); $('#pbar').style.width=((i+.6)/steps.length*100)+'%'; i++; timers.push(setTimeout(tick,1200)); }
    else { $('#pbar').style.width='100%'; timers.push(setTimeout(finishProcessing,500)); } };
  timers.push(setTimeout(tick,300));
};
function finishProcessing(){
  if(S.failNext){ S.failNext=false; go('failed'); return; }
  if(S.role!=='user'){ S.guestUsed=true; S.guestReport=true; S.lang='en'; go('guest-report'); return; }
  const id='r'+Date.now().toString(36); const rerun=S.flow.mode==='rerun';
  S.reports.unshift({id,key:'A',date:'4 Oct 2026',files:S.files.length>0,rerun});
  S.used++; S.lang='en'; S.flow={mode:'new',from:null};
  go('report/'+id); toast(rerun?'New report ready — your earlier one is still saved':'Your report is ready');
}
SCREENS.failed=()=>statusPage('si-bad','alert','Something went wrong with your analysis','<p class="muted">Our system couldn’t finish your report this time. <b>This didn’t use up any of your analyses</b>, and your description and answers are saved.</p><p class="small muted">If it keeps happening, <a href="#/contact">contact us</a>.</p>',`<button class="btn btn-primary btn-block" onclick="go('processing')">${ic('rotate')}Try again</button><a class="btn btn-secondary btn-block" href="#/input">Edit my description</a>`);

/* ---- sign in ---- */
function emailSignin(){
  const v=$('#si-email').value.trim(); S.pendingEmail=v;
  if(!v) S.signinErr='Enter your email address so we can send you a sign-in link.';
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) S.signinErr='That doesn’t look like an email address. Check for a missing @ or dot — for example, name@gmail.com.';
  else { S.signinErr=''; go('check-email'); return; }
  refresh(); $('#si-email').focus();
}
SCREENS.signin=()=>`<div class="narrow page" style="max-width:480px"><div class="card">
  <h1 style="font-size:28px">Sign in or create an account</h1>
  <p class="muted">It’s free. You get 10 analyses every month, and your reports are saved.</p>
  ${S.claimGuest&&S.guestReport?`<div class="alert a-good" style="margin-bottom:16px">${ic('check')}<p>Your report will be saved to your new account as soon as you sign up.</p></div>`:''}
  <div class="stack">
   <button class="btn btn-secondary btn-block" onclick="signIn('google')"><span class="avatar" style="width:28px;height:28px;font-size:14px;border:0;background:#F1ECE3;color:var(--ink)">G</span>Continue with Google</button>
   <button class="btn btn-secondary btn-block" onclick="signIn('microsoft')"><span class="avatar" style="width:28px;height:28px;font-size:14px;border:0;background:#F1ECE3;color:var(--ink)">M</span>Continue with Microsoft</button>
  </div>
  <div class="divider">or use your email</div>
  <div class="field ${S.signinErr?'has-error':''}"><label class="label" for="si-email">Email address</label>
   <input class="input" id="si-email" type="email" inputmode="email" autocomplete="email" placeholder="name@gmail.com" value="${esc(S.pendingEmail)}" onkeydown="if(event.key==='Enter')emailSignin()" aria-describedby="si-help">
   ${S.signinErr?`<div class="err">${ic('alert')}<span>${S.signinErr}</span></div>`:''}
   <p class="help" id="si-help">We’ll email you a link to sign in — no password to remember.</p></div>
  <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="emailSignin()">${ic('mail')}Email me a sign-in link</button>
  <p class="tiny muted center" style="margin-top:16px">By continuing you agree to our <a href="#/terms">Terms of use</a> and <a href="#/privacy">Privacy policy</a>.</p>
 </div><p class="center tiny muted" style="margin-top:16px">Site owner? <button class="linkbtn" style="font-size:13px" onclick="signIn('admin')">Admin sign-in</button></p></div>`;
SCREENS['check-email']=()=>statusPage('si-info','mail','Check your email',`<p class="muted">We’ve sent a sign-in link to <b>${esc(S.pendingEmail||S.email)}</b>. Tap the link in that email to sign in. It works once, for 15 minutes.</p><p class="small muted">Can’t find it? Look in your Spam or Promotions folder.</p>`,`<a class="btn btn-primary btn-block" href="#/email-magic">Open the email (preview)</a><button class="btn btn-secondary btn-block" onclick="toast('A new link is on its way')">Resend link</button><a class="btn btn-ghost btn-block" href="#/signin">Use a different email</a>`);
SCREENS['link-expired']=()=>statusPage('si-warn','clock','This sign-in link has expired','<p class="muted">Sign-in links work once, for 15 minutes. Send yourself a fresh one — it only takes a moment.</p>',`<button class="btn btn-primary btn-block" onclick="go('check-email')">Send a new link to ${esc(S.pendingEmail||S.email)}</button><a class="btn btn-ghost btn-block" href="#/signin">Sign in another way</a>`);
SCREENS.suspended=()=>statusPage('si-bad','ban','Your account has been suspended','<p class="muted">You can’t sign in or run analyses right now. If you think this is a mistake, contact us and we’ll look into it.</p>',`<a class="btn btn-primary btn-block" href="#/contact" onclick="S.contact.topic='My account was suspended'">Contact us</a><a class="btn btn-ghost btn-block" href="#/landing">Back to home</a>`);
SCREENS.notfound=()=>statusPage('si-warn','search','We couldn’t find that page','<p class="muted">The link may be mistyped, or the page may have moved.</p>',`<a class="btn btn-primary btn-block" href="${S.role==='user'?'#/dashboard':'#/landing'}">Go to the home page</a>`);

/* ---- emails ---- */
function emailFrame(subject,body,note){ return `<div class="narrow page"><span class="preview-tag">Email preview</span><p class="small muted">This is what the person receives in their inbox.</p>
  <div class="email"><div class="email-meta"><div><b>From:</b> Untangle</div><div><b>To:</b> ${esc(S.pendingEmail||S.email)}</div><div><b>Subject:</b> ${subject}</div></div><div class="email-body"><div class="logo">${LOGO}Untangle</div>${body}<hr class="sep"><p class="tiny muted" style="margin:0">You’re receiving this because of activity on your Untangle account. We don’t send marketing emails.</p></div></div>${note||''}</div>`; }
SCREENS['email-magic']=()=>emailFrame('Your sign-in link for Untangle',`<h2 style="font-size:22px">Sign in to Untangle</h2><p>Tap the button below to sign in. This link works once, for the next 15 minutes.</p><button class="btn btn-primary" onclick="signIn('email')">Sign in to Untangle</button><p class="small muted" style="margin-top:16px">If you didn’t ask to sign in, you can ignore this email — nothing will happen.</p>`,`<p class="small center" style="margin-top:16px"><a href="#/link-expired">See what happens if the link has expired</a></p>`);
SCREENS['email-ready']=()=>emailFrame('Your Untangle report is ready',`<h2 style="font-size:22px">Your report is ready</h2><p>Namaste ${S.first}, your report <b>“WhatsApp orders to Tally invoices and payments”</b> is ready. We found 5 ideas — 3 you can start this week.</p><a class="btn btn-primary" href="#/report/${S.reports[0]?S.reports[0].id:'A'}" onclick="if(S.role!=='user'){setupUser('returning')}">Open my report</a>`);
SCREENS['email-deleted']=()=>emailFrame('Your Untangle account has been deleted',`<h2 style="font-size:22px">Your account has been deleted</h2><p>As you asked, we’ve permanently deleted your Untangle account, all your reports, process descriptions and uploaded files.</p><p>If you didn’t ask for this, reply to this email straight away.</p><p class="small muted">You’re welcome back any time — you’d start with a fresh account.</p>`);

/* ---- legal & contact ---- */
SCREENS.privacy=()=>`<div class="narrow page legal"><h1>Privacy policy</h1><p class="muted">Last updated 4 October 2026 · Written in plain language</p>
 <div class="card card-tint"><h3 class="h4">The short version</h3><ul class="check-list small" style="margin:0">
  <li>${ic('check')}<span>We store what you give us so we can make and keep your reports.</span></li>
  <li>${ic('check')}<span>Your files stay with us until you delete the report or your account.</span></li>
  <li>${ic('check')}<span>Nobody uses your data to train AI.</span></li>
  <li>${ic('check')}<span>Our team only sees anonymised reports if you switch that on.</span></li></ul></div>
 <h2>What we collect</h2><ul><li><b>Your account:</b> name, email address, how you sign in, and the date you joined.</li><li><b>Each analysis:</b> your process description, follow-up answers, uploaded files, the report (in English and, if you ask, Hindi), chat messages, your rating and any comment.</li><li><b>Usage:</b> how many analyses and chat questions you’ve used, so we can apply the free limits.</li><li><b>Guests:</b> the description, answers and report, plus basic browser and network details so each guest gets one free analysis.</li></ul>
 <h2>How long we keep it</h2><ul><li><b>Files you upload</b> are kept until you delete that report or your account. They are then deleted with it.</li><li><b>Descriptions, answers, reports and chats</b> are kept until you delete the report or your account.</li><li><b>Guest analyses</b> are deleted 24 hours after they’re made, unless you sign up and save them.</li><li><b>Guest browser and network details</b> are kept for at most 30 days.</li><li><b>Backups:</b> deleted data is also removed from our backups within 30 days.</li></ul>
 <h2>Who can see your data</h2><ul><li><b>You.</b></li><li><b>People you share a link with</b> — they see the report only, never your files.</li><li><b>Our team</b> — only if you switch on “Allow Untangle to use my anonymized data” in Settings. It’s off unless you choose it.</li><li><b>Our AI provider</b> processes your description to write your report. Our contract with them says they may not train on your data.</li></ul>
 <h2>Where it’s stored and how it’s protected</h2><p>Your data is stored on secure servers in India. Everything is encrypted while it’s stored and while it travels between your device and us.</p>
 <h2>Your choices</h2><ul><li>Turn data sharing on or off at any time in Settings.</li><li>Delete any report — its files and chat go with it.</li><li>Delete your account — everything is removed and we email you to confirm.</li></ul>
 <h2>Questions</h2><p>Write to us through the <a href="#/contact">Contact page</a> and choose “Privacy or data request”.</p></div>`;
SCREENS.terms=()=>`<div class="narrow page legal"><h1>Terms of use</h1><p class="muted">Last updated 4 October 2026</p>
 <h2>What Untangle does</h2><p>Untangle reads a description of your work process and suggests ideas to automate or simplify it. It gives advice and guides only. It does not log in to, connect to or change any of your apps.</p>
 <h2>Advice, not a guarantee</h2><p>Time savings and costs are estimates. Check prices and your employer’s rules before you buy or set up anything.</p>
 <h2>Free limits</h2><ul><li>Guests: one free analysis, text only.</li><li>Free account: 10 analyses a month, resetting on the 1st at midnight (India time); up to 3 files of 10 MB each per analysis; 10 chat questions per report.</li><li>A re-run counts as a new analysis. Failed analyses don’t count.</li></ul>
 <h2>Fair use</h2><p>Don’t use Untangle to plan anything illegal or harmful, such as fraud. We’ll decline that part of a request, and we may suspend accounts that keep trying.</p>
 <h2>Your content</h2><p>What you write and upload stays yours. You give us permission to process it only to make your reports and answer your questions — and to improve the product only if you switch that on.</p>
 <h2>Changes</h2><p>If we change these terms in a way that matters, we’ll show a notice on the site before it takes effect.</p>
 <h2>Contact</h2><p>Questions? Use the <a href="#/contact">Contact page</a>.</p></div>`;
function contactSubmit(){
  const c=S.contact; c.name=$('#c-name').value.trim(); c.email=$('#c-email').value.trim(); c.topic=$('#c-topic').value; c.msg=$('#c-msg').value.trim();
  const e={};
  if(!c.name) e.name='Please tell us your name.';
  if(!c.email) e.email='Please add your email so we can reply.'; else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email)) e.email='That doesn’t look like an email address — for example, name@gmail.com.';
  if(!c.topic) e.topic='Please choose what your message is about.';
  if(c.msg.length<20) e.msg=c.msg?'Please add a little more detail (at least 20 characters) so we can help.':'Please write your message.';
  S.contactErr=e;
  if(Object.keys(e).length){ refresh(); const f=$('.has-error .input,.has-error .select,.has-error .textarea'); if(f) f.focus(); return; }
  go('contact-sent');
}

 const topics=['A question about a report','A problem with my account','My account was suspended','Privacy or data request','Something else'];
 return `<div class="narrow page"><h1>Contact us</h1><p class="muted">We read every message and reply within 2 working days.</p>
 <div class="card stack">
  ${Object.keys(e).length?`<div class="alert a-error">${ic('alert')}<p>Please fix the ${Object.keys(e).length>1?Object.keys(e).length+' highlighted fields':'highlighted field'} below.</p></div>`:''}
  ${f('name','Your name',`<input class="input" id="c-name" autocomplete="name" value="${esc(c.name)}">`)}
  ${f('email','Your email',`<input class="input" id="c-email" type="email" inputmode="email" autocomplete="email" value="${esc(c.email)}">`)}
  ${f('topic','What is it about?',`<select class="select" id="c-topic"><option value="">Choose one</option>${topics.map(t=>`<option ${c.topic===t?'selected':''}>${t}</option>`).join('')}</select>`)}

 </div></div>`; };
